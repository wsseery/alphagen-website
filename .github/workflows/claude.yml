# Claude Code — responds to @claude mentions in issues and pull requests.
#
# Requires a repository secret named CLAUDE_CODE_OAUTH_TOKEN.
# Generate it locally with `claude setup-token` and add it under
# Settings -> Secrets and variables -> Actions -> New repository secret.
# The token authenticates against the Claude subscription of whoever
# generated it, so runs bill to that subscription rather than API credit.
#
# Only users with write access to this repository can trigger a run;
# bot actors are rejected. Docs: https://code.claude.com/docs/en/github-actions

name: Claude Code

# `issues: [opened]` added 2026-10-01. Before that an @claude mention in the
# BODY of a new issue triggered nothing -- only a comment did -- so issues #2
# and #3 sat with no run. The weekly content automation files an issue with
# the mention in the body, so it depends on this trigger.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Branch on the event. On an `issues` event there is no comment, so the
    # body is the only place to look. On a comment event github.event.issue.body
    # is still the ISSUE's body, so testing it there would start a job for every
    # later comment on any issue whose body carries the mention.
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cost guard: caps how much work a single run can do. Do NOT add
          # show_full_output -- this repo is public, and that flag prints
          # Claude's full output into world-readable Actions logs.
          #
          # 15 -> 60 on 2026-10-05: issues #12 and #13 (weekly content builds)
          # both died at "Reached maximum number of turns (15)" before opening
          # a PR. A weekly build writes several pages plus the sitemap and blog
          # index, and now also generates the OG cards.
          #
          # --allowedTools: the action only permits git commands by default.
          # The OG-card step in each weekly issue runs a throwaway generator
          # (pip install Pillow, python3 make_og.py, then delete it), so python3
          # and the two cleanups it needs are allowed here. make_og.py and the
          # .fonts/ download it may create are also gitignored, so neither can
          # be committed and turn a content PR into a code PR.
          claude_args: >-
            --max-turns 60
            --allowedTools "Bash(python3:*),Bash(ls:*),Bash(rm make_og.py),Bash(rm -f make_og.py),Bash(rm -rf .fonts)"
