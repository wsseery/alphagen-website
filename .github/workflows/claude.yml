# Claude Code — responds to @claude mentions in issues and pull requests.
#
# Requires a repository secret named CLAUDE_CODE_OAUTH_TOKEN.
# Generate it locally with `claude setup-token` and add it under
# Settings -> Secrets and variables -> Actions -> New repository secret.
# The token authenticates against the Claude subscription of whoever
# generated it, so runs bill to that subscription rather than API credit.
#
# Only users with write access to this repository can trigger a run;
# bot actors are rejected. Docs: https://code.claude.com/docs/en/github-actions

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cost guard: uncomment to cap how much work a single run can do.
          # claude_args: "--max-turns 15"
